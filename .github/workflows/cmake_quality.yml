name: CMake Quality Gate

on:
  # Trigger on any push/PR to any branch (matches production/compatibility workflows)
  push:
    branches:
      - '**'
    tags:
      - "v*"
      - "5.*"
  pull_request:
    branches:
      - '**'
  # Manual trigger for debugging
  workflow_dispatch:

env:
  # Use Clang for better sanitizer support
  CC: clang
  CXX: clang++
  # Ccache configuration
  CCACHE_COMPRESS: 1
  CCACHE_DIR: /home/runner/.ccache

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: Sanitizers (ASan + UBSan + LSan)
  # Replaces: native_asan
  # ----------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential libboost-all-dev \
            libssl-dev libdb++-dev libminiupnpc-dev libqrencode-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools libcurl4-openssl-dev \
            libzip-dev zipcmp zipmerge ziptool ccache

      - name: Restore Ccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ccache-quality-${{ github.sha }}
          restore-keys: ccache-quality-

      - name: Setup Concurrency
        run: |
          if [ -z "$CMAKE_BUILD_PARALLEL_LEVEL" ]; then
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
            echo "CTEST_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
            echo "Concurrency: Auto-detected $(nproc) cores."
          else
            echo "Concurrency: Limit set externally to $CMAKE_BUILD_PARALLEL_LEVEL."
          fi

      - name: Configure (Sanitizers)
        run: |
          # -fsanitize=address includes LSan (LeakSanitizer)
          # -fsanitize=undefined catches UB (integer overflow, null deref, etc)
          #
          # ENABLE_DEBUG_LOCKORDER turns on two runtime lock checks that every
          # other job compiles away, so this is the only place they run:
          #
          #   * AssertLockHeld / AssertLockNotHeld. Without the flag
          #     AssertLockHeldInternal is an empty inline (src/sync.h), so a
          #     function annotated EXCLUSIVE_LOCKS_REQUIRED can be called with
          #     no lock held and nothing notices. These abort, so they fail the
          #     ctest step on their own.
          #   * Lock-order tracking, which reports a pair of locks taken in two
          #     different orders. This one reports and continues by design, so
          #     it is gated by the step after the tests rather than by ctest.
          #
          # Both are runtime checks, which is why they live here and not on the
          # Thread Safety job: that one is compile-only and would gain nothing.
          cmake -B build_asan \
            -DENABLE_GUI=OFF \
            -DENABLE_TESTS=ON \
            -DENABLE_DEBUG_LOCKORDER=ON \
            -DUSE_QT6=ON \
            -DUSE_ASM=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        # Removed explicit --parallel flag; CMake reads the env var automatically
        run: cmake --build build_asan

      - name: Test (With Sanitizers)
        env:
          # ASAN options to prevent false positives or known minor issues from failing the build
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/test/sanitizer_suppressions/tsan
          UBSAN_OPTIONS: suppressions=${{ github.workspace }}/test/sanitizer_suppressions/ubsan:print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: malloc_context_size=0:check_initialization_order=1
        run: |
          # We exclude the Qt tests here if they trigger false positives in GUI libs
          # -V so the suite's own output is captured even for tests that pass:
          # the lock-order checker reports through the log, and
          # --output-on-failure alone shows nothing for a passing test.
          set -o pipefail
          ctest --test-dir build_asan -V 2>&1 | tee ctest_asan.log

      - name: Check for lock-order inversions
        run: |
          # The checker reports and continues rather than aborting, on purpose:
          # a single run surfaces every inversion instead of stopping at the
          # first, so one pass shows the whole picture instead of forcing a
          # fix-and-rerun cycle per inversion. That also means the suite can
          # pass while having reported one, so the gate belongs here.
          #
          # sync_tests drives the checker deliberately with its own
          # mutex1/mutex2 fixture and asserts on the message it throws. That
          # report is expected; any other is not.
          if ! grep -q "POTENTIAL DEADLOCK DETECTED" ctest_asan.log; then
            echo "No lock-order reports."
            exit 0
          fi

          unexpected=$(grep -A3 "POTENTIAL DEADLOCK DETECTED" ctest_asan.log \
            | grep "Conflict:" | grep -v "'mutex1'" | grep -v "'mutex2'" || true)

          if [ -n "$unexpected" ]; then
            echo "::error::The unit suite reported a lock-order inversion."
            echo "$unexpected"
            echo
            echo "Full reports, each with the historical and current lock stacks:"
            # Print whole blocks rather than a fixed window. A report runs from
            # the banner to the "potential deadlock detected: a -> b -> a" line
            # and grows with the depth of the two lock stacks; real ones already
            # run 29 lines, so a fixed -A window is one frame from truncating
            # the part worth reading. The cap is a backstop, not the mechanism:
            # a report thrown rather than logged (sync_tests sets throw mode)
            # never prints that closing line, so without it the block would run
            # to the end of the log.
            awk '/POTENTIAL DEADLOCK DETECTED/            {p = 1; n = 0}
                 p                                       {print; n++}
                 /potential deadlock detected:/           {p = 0}
                 p && n >= 80 {print "  ... truncated at 80 lines ..."; p = 0}' ctest_asan.log
            exit 1
          fi

          echo "Only sync_tests' deliberate mutex1/mutex2 report present."

  # ----------------------------------------------------------------------
  # JOB 2: Linter
  # Replaces: lint
  # Ported from: 04_install.sh, 05_before_script.sh, 06_script.sh
  # ----------------------------------------------------------------------
  lint:
    name: Lint Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for subtree and commit checks

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Lint Dependencies
        run: |
          sudo apt-get update
          # Install ClangFormat and Shellcheck
          # Ubuntu 24.04 has sufficiently new versions, removing need for manual download
          sudo apt-get install -y clang-format shellcheck

          # Install specific python linters (Matching versions from 04_install.sh)
          pip install codespell==2.2.2 flake8==4.0.1 mypy==0.942 vulture==2.3

      - name: Prepare Subtree Remotes
        # Logic from 05_before_script.sh
        run: |
          git fetch https://github.com/bitcoin-core/crc32c-subtree.git
          git fetch https://github.com/bitcoin-core/ctaes.git
          git fetch https://github.com/bitcoin-core/secp256k1.git

      - name: Run Lint Checks
        # Logic from 06_script.sh
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          export LC_ALL=C

          # 1. Commit Script Check (Only runs on Pull Requests)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
             echo "Checking commit range: $COMMIT_RANGE"
             # Ensure the commit range is valid before running
             if [ -n "$COMMIT_RANGE" ]; then
                 test/lint/commit-script-check.sh "$COMMIT_RANGE"
             fi
          fi

          # 2. Subtree Checks (Ported from 06_script.sh)
          test/lint/git-subtree-check.sh src/crypto/ctaes
          test/lint/git-subtree-check.sh src/secp256k1
          test/lint/git-subtree-check.sh src/crc32c

          # 3. Main Lint Script
          if [ -f "./test/lint/lint-all.sh" ]; then
             ./test/lint/lint-all.sh
          else
             echo "Error: lint-all.sh not found."
             exit 1
          fi

  # ----------------------------------------------------------------------
  # JOB 3: Clang Thread Safety Analysis
  # Compile-only gate. Clang's -Wthread-safety statically checks the
  # GUARDED_BY / EXCLUSIVE_LOCKS_REQUIRED annotations (issue #2869); gcc
  # ignores them entirely. WERROR_THREAD_SAFETY=ON promotes a stale or
  # missing annotation to a build error. GUI is built here (ENABLE_GUI=ON)
  # because the Sanitizers job builds with ENABLE_GUI=OFF and would not
  # cover the Qt wallet code.
  #
  # ENABLE_MULTIPROCESS=ON for the same reason: without it the IPC transport,
  # the serving interfaces and the generated capnp proxies compile in no CI job
  # that runs the analyzer, so annotations on the code that most needs
  # them — the GUI/node seam, where notifications cross threads and processes —
  # were never checked. That needs capnproto + libcapnp-dev below. (The
  # cmake_multiprocess workflow builds the same surface, but with gcc, which
  # ignores the annotations entirely.)
  #
  # ENABLE_TESTS=ON, and the test targets on the build line, because the
  # analysis is per-translation-unit: a TU that is never compiled is never
  # analysed. While the tests were excluded their annotation failures were
  # invisible and accumulated (issue #3344 -- seven of them, across three
  # files). Tests call the same annotated production API as everything else,
  # and calling a function that requires cs_main without holding it is the
  # same defect wherever it is written.
  # ----------------------------------------------------------------------
  thread-safety:
    name: Thread Safety (Clang)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential libboost-all-dev \
            libssl-dev libdb++-dev libminiupnpc-dev libqrencode-dev \
            capnproto libcapnp-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6charts6-dev libqt6svg6-dev libqt6core5compat6-dev \
            libxkbcommon-dev libcurl4-openssl-dev libzip-dev zipcmp zipmerge \
            ziptool ccache

      - name: Restore Ccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ccache-tsa-${{ github.sha }}
          restore-keys: ccache-tsa-

      - name: Setup Concurrency
        run: |
          if [ -z "$CMAKE_BUILD_PARALLEL_LEVEL" ]; then
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
            echo "Concurrency: Auto-detected $(nproc) cores."
          else
            echo "Concurrency: Limit set externally to $CMAKE_BUILD_PARALLEL_LEVEL."
          fi

      - name: Configure (Thread Safety Analysis)
        run: |
          cmake -B build_tsa \
            -DENABLE_GUI=ON \
            -DENABLE_TESTS=ON \
            -DUSE_QT6=ON \
            -DENABLE_MULTIPROCESS=ON \
            -DWERROR_THREAD_SAFETY=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (compile-only — analysis runs at compile time)
        # -k so one run reports every annotation failure. Without it the build
        # stops at the first, and finding the rest takes a fix-and-rerun cycle:
        # the run that motivated adding the test targets stopped after 63 of 92
        # test TUs and never reached one of the three files at fault.
        run: cmake --build build_tsa --target gridcoinresearch gridcoinresearchd test_gridcoin test_gridcoin-qt -- -k

  # ----------------------------------------------------------------------
  # JOB 4: Unit suites in isolation, and one shuffled run
  # test_gridcoin runs every suite in one process on one global fixture, so
  # a suite that leaves process state behind can break -- or prop up -- the
  # suite that links after it, and which one that is differs by platform
  # (src/test/README.md, "Process state, and what a suite must put back").
  # The in-binary detector fails a suite that leaks; this job catches the
  # other half, a
  # suite that only passes because of what an earlier one left behind, by
  # running each suite in its own process. The shuffled run is the same
  # check from the other direction and is informational: it is reported as
  # a warning annotation with the seed to reproduce it, not as a failure,
  # because one seed per run is a sample, not a gate.
  # ----------------------------------------------------------------------
  suite-isolation:
    name: Unit Suite Isolation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential libboost-all-dev \
            libssl-dev libdb++-dev libminiupnpc-dev libqrencode-dev \
            libcurl4-openssl-dev libzip-dev zipcmp zipmerge ziptool ccache

      - name: Restore Ccache
        uses: actions/cache@v5
        with:
          path: /home/runner/.ccache
          key: ccache-isolation-${{ github.sha }}
          restore-keys: ccache-isolation-

      - name: Setup Concurrency
        run: |
          if [ -z "$CMAKE_BUILD_PARALLEL_LEVEL" ]; then
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> $GITHUB_ENV
            echo "Concurrency: Auto-detected $(nproc) cores."
          else
            echo "Concurrency: Limit set externally to $CMAKE_BUILD_PARALLEL_LEVEL."
          fi

      - name: Configure
        run: |
          cmake -B build_isolation \
            -DENABLE_GUI=OFF \
            -DENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build test_gridcoin
        run: cmake --build build_isolation --target test_gridcoin

      - name: Run every suite alone
        run: contrib/devtools/run-unit-suites-isolated.sh build_isolation/src/test/test_gridcoin

      - name: Run the whole binary in shuffled order (informational)
        id: shuffled
        # The seed is the run number, so every run samples a new order and a
        # failure names the seed that reproduces it. Non-gating: see the job
        # comment. The step after this one turns a failure into a warning
        # annotation on the run and the PR, so it is seen rather than
        # swallowed.
        continue-on-error: true
        run: |
          seed=$(( ${{ github.run_number }} % 100000 + 1 ))
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          set -o pipefail
          contrib/devtools/run-unit-suites-isolated.sh --random "$seed" \
            build_isolation/src/test/test_gridcoin 2>&1 | tee shuffled.log

      - name: Report a shuffled-order failure
        if: steps.shuffled.outcome == 'failure'
        run: |
          seed="${{ steps.shuffled.outputs.seed }}"
          echo "::warning title=Unit suite failed in shuffled order::test_gridcoin --random=$seed failed on this commit; the log is in the shuffled-order artifact. This does not fail the job."
          {
            echo "### Unit suite failed in shuffled order"
            echo
            echo "Reproduce with \`test_gridcoin --random=$seed\` (or \`contrib/devtools/run-unit-suites-isolated.sh --random $seed <binary>\`)."
            echo
            echo '```'
            grep -E "error|fail|leak" shuffled.log | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the shuffled-order log
        if: steps.shuffled.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: shuffled-order-unit-log
          path: shuffled.log
